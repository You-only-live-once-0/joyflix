name: Validate second optimization pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-round2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply optimization patch
        run: python3 scripts/optimize-round2.py

      - name: Generate runtime files
        run: pnpm gen:runtime && pnpm gen:manifest

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            next.config.js \
            src/lib/site-password.ts \
            src/lib/config.ts \
            src/lib/upstash.db.ts \
            src/lib/db.client.ts \
            src/lib/downstream.ts \
            src/app/api/search/route.ts \
            src/app/api/searchstream/route.ts \
            src/lib/utils.ts \
            src/app/play/page.tsx \
            src/app/api/login/route.ts \
            src/app/api/logout/route.ts \
            src/middleware.ts
          git commit --no-verify -m "perf: reduce Redis round trips and harden streaming"
          git push --no-verify