name: Validate second optimization pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-round2.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply optimization patch
        run: python3 scripts/optimize-round2.py

      - name: Generate runtime files
        run: pnpm gen:runtime && pnpm gen:manifest

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Commit verified optimization
        shell: bash
        run: |
          rm scripts/optimize-round2.py
          rm .github/workflows/optimize-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "perf: reduce Redis round trips and harden streaming"
          git push --no-verify
