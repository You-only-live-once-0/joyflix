name: Optimize playback and storage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimize-playback-storage.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Patch
        run: python scripts/optimize_playback_storage.py
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit
        run: |
          rm .github/workflows/optimize-playback-storage.yml
          rm scripts/optimize_playback_storage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: speed up playback startup and storage reads"
          git push
