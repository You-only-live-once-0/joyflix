"""
          new = """      // 换源不能被播放记录/跳过配置的远程写入阻塞。
      // 先记住旧源，视频切换完成后再后台同步这些状态。
      const previousSource = currentSourceRef.current;
      const previousId = currentIdRef.current;

"""
          text = replace_once(text, old, new, 'remove blocking database work from source switch')

          old = """      setCurrentSource(newSource);
      setCurrentId(newId);
      setDetail(newDetail);
      setCurrentEpisodeIndex(targetIndex);
"""
          new = """      setCurrentSource(newSource);
      setCurrentId(newId);
      setDetail(newDetail);
      setCurrentEpisodeIndex(targetIndex);

      if (
        previousSource &&
        previousId &&
        (previousSource !== newSource || previousId !== newId)
      ) {
        void Promise.allSettled([
          deletePlayRecord(previousSource, previousId),
          deleteSkipConfig(previousSource, previousId),
          saveSkipConfig(newSource, newId, skipConfigRef.current),
        ]).then((results) => {
          if (results.some((result) => result.status === 'rejected')) {
            console.warn('换源后的后台状态同步有部分失败');
          }
        });
      }
"""
          text = replace_once(text, old, new, 'background source-switch persistence')

          old = """        if (process.env.NEXT_PUBLIC_STORAGE_TYPE === 'upstash') {
          interval = 20000;
        }
"""
          new = """        if (process.env.NEXT_PUBLIC_STORAGE_TYPE === 'upstash') {
          interval = 30000;
        }
"""
          text = replace_once(text, old, new, 'reduce play-record write frequency')

          old = """      artPlayerRef.current.on('pause', () => {
        saveCurrentPlayProgress();
      });

      if (artPlayerRef.current?.video) {
"""
          new = """      if (artPlayerRef.current?.video) {
"""
          text = replace_once(text, old, new, 'remove duplicate pause save listener')

          play_path.write_text(text)

          upstash_path = Path('src/lib/upstash.db.ts')
          text = upstash_path.read_text()

          old = """    const result: Record<string, PlayRecord> = {};
    for (const fullKey of keys) {
      const value = await withRetry(() => this.client.get(fullKey));
      if (value) {
        // 截取 source+id 部分
        const keyPart = ensureString(fullKey.replace(`u:${userName}:pr:`, ''));
        result[keyPart] = value as PlayRecord;
      }
    }
    return result;
"""
          new = """    // 批量读取，避免播放记录越多就产生越多次 Upstash REST 往返。
    const values = await withRetry(() => this.client.mget(keys));
    const result: Record<string, PlayRecord> = {};
    keys.forEach((fullKey, index) => {
      const value = values[index];
      if (value) {
        // 截取 source+id 部分
        const keyPart = ensureString(fullKey.replace(`u:${userName}:pr:`, ''));
        result[keyPart] = value as PlayRecord;
      }
    });
    return result;
"""
          text = replace_once(text, old, new, 'batch play-record reads')

          old = """    const result: Record<string, Favorite> = {};
    for (const fullKey of keys) {
      const value = await withRetry(() => this.client.get(fullKey));
      if (value) {
        const keyPart = ensureString(fullKey.replace(`u:${userName}:fav:`, ''));
        result[keyPart] = value as Favorite;
      }
    }
    return result;
"""
          new = """    // 收藏同样用 MGET 批量读取，避免 N+1 REST 请求。
    const values = await withRetry(() => this.client.mget(keys));
    const result: Record<string, Favorite> = {};
    keys.forEach((fullKey, index) => {
      const value = values[index];
      if (value) {
        const keyPart = ensureString(fullKey.replace(`u:${userName}:fav:`, ''));
        result[keyPart] = value as Favorite;
      }
    });
    return result;
"""
          text = replace_once(text, old, new, 'batch favorite reads')
          upstash_path.write_text(text)
          PY
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit optimizations
        shell: bash
        run: |
          rm .github/workflows/optimize-playback-storage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/play/page.tsx src/lib/upstash.db.ts .github/workflows/optimize-playback-storage.yml
          git commit -m 'perf: speed up playback startup and storage reads'
          git push
