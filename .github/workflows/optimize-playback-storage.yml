name: Optimize playback and storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-playback-storage.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply optimizations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'patch target not unique ({text.count(old)}): {label}')
              return text.replace(old, new, 1)

          play_path = Path('src/app/play/page.tsx')
          text = play_path.read_text()

          old = """    const survivingSources = pingResults
        .filter(result => result.ping < PING_THRESHOLD)
        .sort((a, b) => a.ping - b.ping)
        .map(result => result.source);
"""
          new = """    // 深度测速会读取实际视频分片。片源很多时全部测速会抢占首播带宽，
    // 所以只对 Ping 最快的少量候选做完整测速。
    const MAX_FULL_TEST_SOURCES = 6;
    const survivingSources = pingResults
        .filter(result => result.ping < PING_THRESHOLD)
        .sort((a, b) => a.ping - b.ping)
        .slice(0, MAX_FULL_TEST_SOURCES)
        .map(result => result.source);
"""
          text = replace_once(text, old, new, 'limit full source tests')

          old = """    const fetchSourcesData = async (query: string): Promise<SearchResult[]> => {
      // 根据搜索词获取全部源信息
      try {
        const response = await fetch(
          `/api/search?q=${encodeURIComponent(query.trim())}`
        );
        if (!response.ok) {
          throw new Error('搜索失败');
        }
        const data = await response.json();

        // 处理搜索结果，根据规则过滤
        const results = data.results.filter(
          (result: SearchResult) =>
            result.title.replaceAll(' ', '').toLowerCase() ===
              videoTitleRef.current.replaceAll(' ', '').toLowerCase() &&
            (videoYearRef.current
              ? result.year.toLowerCase() === videoYearRef.current.toLowerCase()
              : true) &&
            (searchType
              ? (searchType === 'tv' && result.episodes.length > 1) ||
                (searchType === 'movie' && result.episodes.length === 1)
              : true)
        );
        setAvailableSources(results);
        return results;
      } catch (err) {
        setSourceSearchError(err instanceof Error ? err.message : '搜索失败');
        setAvailableSources([]);
        return [];
      } finally {
        setSourceSearchLoading(false);
      }
    };
"""
          new = """    const fetchSourcesData = async (
      query: string,
      matchTitle = videoTitleRef.current,
      matchYear = videoYearRef.current,
      updateState = true
    ): Promise<SearchResult[]> => {
      // 根据搜索词获取全部源信息
      try {
        const response = await fetch(
          `/api/search?q=${encodeURIComponent(query.trim())}`
        );
        if (!response.ok) {
          throw new Error('搜索失败');
        }
        const data = await response.json();

        // 处理搜索结果，根据规则过滤
        const results = data.results.filter(
          (result: SearchResult) =>
            result.title.replaceAll(' ', '').toLowerCase() ===
              matchTitle.replaceAll(' ', '').toLowerCase() &&
            (matchYear
              ? result.year.toLowerCase() === matchYear.toLowerCase()
              : true) &&
            (searchType
              ? (searchType === 'tv' && result.episodes.length > 1) ||
                (searchType === 'movie' && result.episodes.length === 1)
              : true)
        );
        if (updateState) setAvailableSources(results);
        return results;
      } catch (err) {
        setSourceSearchError(err instanceof Error ? err.message : '搜索失败');
        if (updateState) setAvailableSources([]);
        return [];
      } finally {
        if (updateState) setSourceSearchLoading(false);
      }
    };
"""
          text = replace_once(text, old, new, 'parameterize source search')

          old = """      let sourcesInfo = await fetchSourcesData(searchTitle || videoTitle);
      if (
        currentSource &&
        currentId &&
        !sourcesInfo.some(
          (source) => source.source === currentSource && source.id === currentId
        )
      ) {
        sourcesInfo = await fetchSourceDetail(currentSource, currentId);
      }
"""
          new = """      const directSourceMode = Boolean(
        currentSource && currentId && !needPreferRef.current
      );
      let sourcesInfo: SearchResult[] = [];

      if (directSourceMode && currentSource && currentId) {
        // “继续观看 / 收藏直达”已有精确 source + id 时直接取详情，
        // 不再先等待全片源搜索，尽快开始首播。
        sourcesInfo = await fetchSourceDetail(currentSource, currentId);

        if (sourcesInfo.length > 0) {
          const directDetail = sourcesInfo[0];
          // 首播后再补齐备用线路，避免全片源请求与首批视频分片抢带宽。
          window.setTimeout(() => {
            void fetchSourcesData(
              searchTitle || directDetail.title,
              directDetail.title,
              directDetail.year,
              false
            ).then((backgroundSources) => {
              if (backgroundSources.length === 0) return;
              const merged = [
                directDetail,
                ...backgroundSources.filter(
                  (source) =>
                    !(
                      source.source === directDetail.source &&
                      source.id === directDetail.id
                    )
                ),
              ];
              setAvailableSources(merged);
            });
          }, 1500);
        } else {
          // 精确详情失效时再回退到全片源搜索。
          sourcesInfo = await fetchSourcesData(searchTitle || videoTitle);
        }
      } else {
        sourcesInfo = await fetchSourcesData(searchTitle || videoTitle);
        if (
          currentSource &&
          currentId &&
          !sourcesInfo.some(
            (source) => source.source === currentSource && source.id === currentId
          )
        ) {
          const exactSource = await fetchSourceDetail(currentSource, currentId);
          if (exactSource.length > 0) {
            sourcesInfo = [
              ...exactSource,
              ...sourcesInfo.filter(
                (source) =>
                  !(
                    source.source === exactSource[0].source &&
                    source.id === exactSource[0].id
                  )
              ),
            ];
          }
        }
      }
"""
          text = replace_once(text, old, new, 'direct source startup path')

          old = """      // 短暂延迟让用户看到完成状态
      setTimeout(() => {
        setLoading(false);
      }, 1000);
"""
          new = """      // 数据已齐后立即进入播放器，不人为增加 1 秒等待。
