name: Fix public media fetch

on:
  push:
    paths:
      - '.github/workflows/fix-public-media-fetch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Use edge-compatible requests
        run: node scripts/fix-public-media-fetch.mjs
      - name: Commit request fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use edge-compatible public media requests"
          git push
