name: Optimize playback smoothness

on:
  push:
    branches:
      - main
    paths:
      - scripts/optimize-playback.py
      - .github/workflows/optimize-playback.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply playback optimization
        run: python scripts/optimize-playback.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate runtime files
        run: pnpm gen:runtime && pnpm gen:manifest

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Commit verified optimization
        shell: bash
        run: |
          rm scripts/optimize-playback.py
          rm .github/workflows/optimize-playback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "perf: stabilize HLS playback and adaptive buffering"
          git push --no-verify
