name: Optimize critical playback and search paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-critical-paths.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply patches
        run: |
          python3 scripts/optimize_critical_paths.py
          python3 scripts/fix_critical_type.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate runtime files
        run: pnpm gen:runtime && pnpm gen:manifest

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Cleanup and commit
        shell: bash
        run: |
          rm scripts/optimize_critical_paths.py
          rm scripts/fix_critical_type.py
          rm .github/workflows/optimize-critical-paths.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'perf: accelerate playback startup and search cancellation'
          git push --no-verify
