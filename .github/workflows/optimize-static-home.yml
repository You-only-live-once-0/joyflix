name: Optimize static shell and home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-static-home.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply static and home optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove unused headers() call from root layout. It forces dynamic rendering for the whole tree.
          p = Path('src/app/layout.tsx')
          s = p.read_text()
          s = s.replace("import { headers } from 'next/headers'; // 导入 headers\n", '', 1)
          s = re.sub(
              r"\n// 辅助函数，用于检测 Android 用户代理\nfunction isAndroid\(userAgent: string\): boolean \{\n  return /Android/i\.test\(userAgent\);\n\}\n",
              '\n',
              s,
              count=1,
          )
          s = s.replace("  const headersList = headers();\n  const userAgent = headersList.get('user-agent') || '';\n  const isAndroidDevice = isAndroid(userAgent);\n\n", '', 1)
          p.write_text(s)

          # Fetch homepage custom category together with the other recommendation requests.
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old = """        const [moviesData, tvShowsData, varietyShowsData, bangumiCalendarData] =\n          await Promise.all([\n"""
          new = """        const [\n          moviesData,\n          tvShowsData,\n          varietyShowsData,\n          bangumiCalendarData,\n          customCategoryData,\n        ] = await Promise.all([\n"""
          if old not in s:
              raise SystemExit('home Promise.all declaration not found')
          s = s.replace(old, new, 1)

          old_tail = """            GetBangumiCalendarData(),\n          ]);\n"""
          new_tail = """            GetBangumiCalendarData(),\n            getDoubanList({\n              tag: '华语',\n              type: 'movie',\n              pageLimit: 25,\n              pageStart: 0,\n            }),\n          ]);\n"""
          if old_tail not in s:
              raise SystemExit('home Promise.all tail not found')
          s = s.replace(old_tail, new_tail, 1)

          serial_block = """        // 获取自定义分类数据：电影 - 华语\n        const customCategoryData = await getDoubanList({\n          tag: '华语',\n          type: 'movie',\n          pageLimit: 25,\n          pageStart: 0,\n        });\n"""
          if serial_block not in s:
              raise SystemExit('serial custom category block not found')
          s = s.replace(serial_block, '', 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/optimize-static-home.yml

      - name: Validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit optimizations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/layout.tsx src/app/page.tsx .github/workflows/optimize-static-home.yml
          git commit -m 'perf: enable static shell and parallelize home data'
          git push origin HEAD:main
