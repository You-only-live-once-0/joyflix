name: Apply public media runtime fix

on:
  push:
    paths:
      - '.github/workflows/apply-public-media-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply verified public media runtime
        run: node scripts/apply-public-media-runtime-fix.mjs
      - name: Commit verified public media runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: run public media adapters in Node runtime"
          git push
