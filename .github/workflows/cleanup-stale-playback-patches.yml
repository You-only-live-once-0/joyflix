name: Cleanup stale playback patch jobs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-playback-patches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove obsolete one-shot patch files
        run: |
          rm -f .github/workflows/optimize-playback.yml
          rm -f .github/workflows/optimize-playback-storage.yml
          rm -f scripts/optimize-playback.py
          rm -f scripts/optimize_playback_storage.py
          rm -f .github/workflows/cleanup-stale-playback-patches.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove obsolete playback patch jobs'
          git push
