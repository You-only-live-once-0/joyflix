name: Optimize search and runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-search-runtime.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Search page: remove duplicate requests, per-frame polling, repeated full-array sorting.
          p = Path('src/app/search/page.tsx')
          s = p.read_text()

          raf_block = """    // 使用 requestAnimationFrame 持续检测滚动位置\n    let isRunning = false;\n    const checkScrollPosition = () => {\n      if (!isRunning) return;\n\n      const scrollTop = getScrollTop();\n      const shouldShow = scrollTop > 300;\n      setShowBackToTop(shouldShow);\n\n      requestAnimationFrame(checkScrollPosition);\n    };\n\n    // 启动持续检测\n    isRunning = true;\n    checkScrollPosition();\n\n"""
          if raf_block in s:
              s = s.replace(raf_block, '', 1)
          s = s.replace("      isRunning = false; // 停止 requestAnimationFrame 循环\n\n", '', 1)

          # router.push changes searchParams, whose effect already performs the request.
          s = s.replace("    // 直接发请求\n    fetchSearchResults(trimmed);\n\n", '', 1)
          s = s.replace("    fetchSearchResults(suggestion);\n", '', 1)

          old_sort = re.compile(r"""              setSearchResults\(\(prevResults\) => \{\n                const allResults = \[\.\.\.prevResults, \.\.\.filteredResults\];\n                return allResults\.sort\(\(a, b\) => \{.*?                \}\);\n              \}\);""", re.S)
          s, n = old_sort.subn("""              // 聚合结果会在 useMemo 中统一排序；这里仅追加，避免每个流式分块都对全量结果重新排序。\n              setSearchResults((prevResults) => [\n                ...prevResults,\n                ...filteredResults,\n              ]);""", s, count=1)
          if n != 1:
              raise SystemExit('search result sort block not found')
          p.write_text(s)

          # 2) Streaming search: Node runtime is required by the public-media adapters.
          p = Path('src/app/api/searchstream/route.ts')
          s = p.read_text()
          s = s.replace("export const runtime = 'edge';", "export const runtime = 'nodejs';", 1)
          old = """  const config = await getConfig();\n  const apiSites = config.SourceConfig.filter((site) => !site.disabled);\n  const cacheTime = await getCacheTime();\n"""
          new = """  const config = await getConfig();\n  // 同一个 API 地址只请求一次，避免配置别名造成重复出站请求。\n  const seenApis = new Set<string>();\n  const apiSites = config.SourceConfig.filter((site) => !site.disabled).filter(\n    (site) => {\n      if (seenApis.has(site.api)) return false;\n      seenApis.add(site.api);\n      return true;\n    }\n  );\n  const cacheTime = await getCacheTime();\n"""
          if old not in s:
              raise SystemExit('searchstream source block not found')
          s = s.replace(old, new, 1)
          s = s.replace('20000)', '10000)', 1)
          p.write_text(s)

          # 3) Non-streaming search used by playback source selection: same dedupe and faster timeout.
          p = Path('src/app/api/search/route.ts')
          s = p.read_text()
          old = """  const config = await getConfig();\n  const apiSites = config.SourceConfig.filter((site) => !site.disabled);\n  // 添加超时控制和错误处理，避免慢接口拖累整体响应\n"""
          new = """  const config = await getConfig();\n  const seenApis = new Set<string>();\n  const apiSites = config.SourceConfig.filter((site) => !site.disabled).filter(\n    (site) => {\n      if (seenApis.has(site.api)) return false;\n      seenApis.add(site.api);\n      return true;\n    }\n  );\n  // 添加超时控制和错误处理，避免慢接口拖累整体响应\n"""
          if old not in s:
              raise SystemExit('search source block not found')
          s = s.replace(old, new, 1)
          s = s.replace('20000)', '10000)', 1)
          p.write_text(s)

          # 4) Recommendations: never depend on NEXT_PUBLIC_BASE_URL being configured at runtime.
          p = Path('src/app/api/recommendations/route.ts')
          s = p.read_text()
          s = s.replace('export async function GET() {', 'export async function GET(request: Request) {', 1)
          s = s.replace("      console.log(`正在从: ${process.env.NEXT_PUBLIC_BASE_URL}/api/douban/categories 获取数据`);\n", '', 1)
          old = """        const fetchUrl = `${process.env.NEXT_PUBLIC_BASE_URL}/api/douban/categories?kind=movie&category=热门&type=全部&limit=50`;\n"""
          new = """        const origin = new URL(request.url).origin;\n        const fetchUrl = `${origin}/api/douban/categories?kind=movie&category=热门&type=全部&limit=50`;\n"""
          if old not in s:
              raise SystemExit('recommendations base url block not found')
          s = s.replace(old, new, 1)
          old_return = """    return NextResponse.json({ list: selectedRecommendations });\n"""
          new_return = """    return NextResponse.json(\n      { list: selectedRecommendations },\n      {\n        headers: {\n          'Cache-Control': 'public, s-maxage=3600, stale-while-revalidate=86400',\n          'Vercel-CDN-Cache-Control': 'public, s-maxage=3600',\n        },\n      }\n    );\n"""
          if old_return not in s:
              raise SystemExit('recommendations return block not found')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)

          # 5) Let the new PWA service worker immediately control open tabs after deployment.
          p = Path('next.config.js')
          s = p.read_text()
          old = """  skipWaiting: true,\n});\n"""
          new = """  skipWaiting: true,\n  clientsClaim: true,\n});\n"""
          if old not in s:
              raise SystemExit('PWA config block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/optimize-search-runtime.yml

      - name: Validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit optimized runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/search/page.tsx src/app/api/searchstream/route.ts src/app/api/search/route.ts src/app/api/recommendations/route.ts next.config.js .github/workflows/optimize-search-runtime.yml
          git commit -m 'perf: reduce duplicate search work and runtime latency'
          git push origin HEAD:main
