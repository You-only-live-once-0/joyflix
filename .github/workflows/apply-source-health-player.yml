name: Apply source health player optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-source-health-player.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch player
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app/play/page.tsx')
          text = path.read_text()

          replacements = []

          replacements.append((
          "import { SearchResult } from '@/lib/types';\nimport { getVideoResolutionFromM3u8, processImageUrl } from '@/lib/utils';",
          "import { SearchResult } from '@/lib/types';\nimport {\n  isSourceCoolingDown,\n  rankSourcesByHealth,\n  recordSourceFailure,\n  recordSourceStall,\n  recordSourceSuccess,\n} from '@/lib/source-health.client';\nimport { getVideoResolutionFromM3u8, processImageUrl } from '@/lib/utils';"
          ))

          replacements.append((
          "  const playbackHealthRef = useRef({\n    stalls: 0,\n    lastStallAt: 0,\n    lastFailoverAt: 0,\n    failedSources: new Set<string>(),\n  });",
          "  const playbackHealthRef = useRef({\n    stalls: 0,\n    lastStallAt: 0,\n    lastFailoverAt: 0,\n    failedSources: new Set<string>(),\n  });\n  const stablePlaybackTimerRef = useRef<NodeJS.Timeout | null>(null);"
          ))

          replacements.append((
          "  const preferBestSource = async (\n    sources: SearchResult[]\n  ): Promise<SearchResult> => {\n    if (sources.length === 1) return sources[0];",
          "  const preferBestSource = async (\n    sources: SearchResult[]\n  ): Promise<SearchResult> => {\n    // 先利用历史播放健康度排序，并临时跳过近期连续失败的片源。\n    // 如果所有源都在冷却，则仍保留全部源作为兜底，避免误判导致无片可播。\n    const healthRankedSources = rankSourcesByHealth(sources);\n    const healthySources = healthRankedSources.filter(\n      (source) => !isSourceCoolingDown(source.source)\n    );\n    sources = healthySources.length > 0 ? healthySources : healthRankedSources;\n\n    if (sources.length === 1) return sources[0];"
          ))

          replacements.append((
          "          if (candidate && episodeUrl) {",
          "          if (\n            candidate &&\n            episodeUrl &&\n            !isSourceCoolingDown(candidate.source)\n          ) {"
          ))

          replacements.append((
          "      if (winner) {\n        localStorage.setItem(",
          "      if (winner) {\n        recordSourceSuccess(winner.source);\n        localStorage.setItem("
          ))

          replacements.append((
          "  const cleanupPlayer = () => {\n    if (artPlayerRef.current) {",
          "  const cleanupPlayer = () => {\n    if (stablePlaybackTimerRef.current) {\n      clearTimeout(stablePlaybackTimerRef.current);\n      stablePlaybackTimerRef.current = null;\n    }\n\n    if (artPlayerRef.current) {"
          ))

          replacements.append((
          "    console.log(videoUrl);\n\n    // 检测是否为WebKit浏览器",
          "    console.log(videoUrl);\n    const playbackAttemptStartedAt = performance.now();\n    let startupRecorded = false;\n\n    // 检测是否为WebKit浏览器"
          ))

          replacements.append((
          "                health.lastStallAt = now;\n                health.stalls += 1;",
          "                health.lastStallAt = now;\n                health.stalls += 1;\n                recordSourceStall(currentSourceRef.current);\n                if (stablePlaybackTimerRef.current) {\n                  clearTimeout(stablePlaybackTimerRef.current);\n                  stablePlaybackTimerRef.current = null;\n                }"
          ))

          replacements.append((
          "                  const currentKey = `${currentSourceRef.current}-${currentIdRef.current}`;\n                  health.failedSources.add(currentKey);",
          "                  const currentKey = `${currentSourceRef.current}-${currentIdRef.current}`;\n                  health.failedSources.add(currentKey);\n                  recordSourceFailure(currentSourceRef.current);"
          ))

          old_candidate = """                  const episodeIndex = currentEpisodeIndexRef.current;\n                  const candidate = availableSources.find((source) => {\n                    const key = `${source.source}-${source.id}`;\n                    return (\n                      key !== currentKey &&\n                      !health.failedSources.has(key) &&\n                      Boolean(source.episodes?.[episodeIndex])\n                    );\n                  });"""
          new_candidate = """                  const episodeIndex = currentEpisodeIndexRef.current;\n                  const candidate = rankSourcesByHealth(\n                    availableSources.filter((source) => {\n                      const key = `${source.source}-${source.id}`;\n                      return (\n                        key !== currentKey &&\n                        !health.failedSources.has(key) &&\n                        Boolean(source.episodes?.[episodeIndex])\n                      );\n                    })\n                  )[0];"""
          replacements.append((old_candidate, new_candidate))

          replacements.append((
          "      artPlayerRef.current.on('play', () => {\n        requestWakeLock();\n      });",
          "      artPlayerRef.current.on('play', () => {\n        requestWakeLock();\n      });\n\n      // 连续稳定播放 30 秒后，解除此前因卡顿设置的清晰度上限，\n      // 同时把当前源记为健康。这样临时降码率不会一直锁死低画质。\n      artPlayerRef.current.on('video:playing', () => {\n        if (stablePlaybackTimerRef.current) {\n          clearTimeout(stablePlaybackTimerRef.current);\n        }\n        const sourceAtStart = currentSourceRef.current;\n        stablePlaybackTimerRef.current = setTimeout(() => {\n          if (\n            artPlayerRef.current &&\n            !artPlayerRef.current.paused &&\n            currentSourceRef.current === sourceAtStart\n          ) {\n            const activeHls = artPlayerRef.current.video?.hls;\n            if (activeHls) activeHls.autoLevelCapping = -1;\n            playbackHealthRef.current.stalls = 0;\n            recordSourceSuccess(sourceAtStart);\n          }\n        }, 30000);\n      });"
          ))

          replacements.append((
          "      artPlayerRef.current.on('pause', () => {\n        releaseWakeLock();\n        saveCurrentPlayProgress();\n      });",
          "      artPlayerRef.current.on('pause', () => {\n        if (stablePlaybackTimerRef.current) {\n          clearTimeout(stablePlaybackTimerRef.current);\n          stablePlaybackTimerRef.current = null;\n        }\n        releaseWakeLock();\n        saveCurrentPlayProgress();\n      });"
          ))

          replacements.append((
          "      artPlayerRef.current.on('video:canplay', () => {\n        // 不在短暂恢复时立即清空卡顿计数。卡顿计数会在 45 秒稳定窗口后自动衰减，\n        // 这样连续反复缓冲可以可靠触发备用源切换。",
          "      artPlayerRef.current.on('video:canplay', () => {\n        // 不在短暂恢复时立即清空卡顿计数。卡顿计数会在 45 秒稳定窗口后自动衰减，\n        // 这样连续反复缓冲可以可靠触发备用源切换。\n        if (!startupRecorded && currentSourceRef.current) {\n          startupRecorded = true;\n          recordSourceSuccess(\n            currentSourceRef.current,\n            performance.now() - playbackAttemptStartedAt\n          );\n        }"
          ))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-source-health-player.yml

      - name: Validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run build

      - name: Commit optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/play/page.tsx .github/workflows/apply-source-health-player.yml
          git commit -m 'perf: learn source health and recover playback quality'
          git push
