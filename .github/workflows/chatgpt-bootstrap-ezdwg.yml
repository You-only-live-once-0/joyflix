name: ChatGPT bootstrap ezdwg artifact

on:
  push:
    branches:
      - chatgpt-ezdwg-bootstrap-20260820

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ezdwg-bootstrap-20260820
      - name: Download wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ezdwg-artifact
          mkdir -p /tmp/ezdwg-artifact bootstrap
          python3 -m pip download --no-deps ezdwg==0.12.4 -d /tmp/ezdwg-artifact
          echo "$GITHUB_RUN_ID" > bootstrap/artifact_run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/artifact_run_id.txt
          git commit -m 'chore: record temporary ezdwg artifact run'
          git push origin HEAD:chatgpt-ezdwg-bootstrap-20260820
      - uses: actions/upload-artifact@v4
        with:
          name: ezdwg-wheel
          path: /tmp/ezdwg-artifact/*.whl
          retention-days: 1
