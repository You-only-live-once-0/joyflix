name: ChatGPT bootstrap LibreDWG artifact

on:
  push:
    branches:
      - chatgpt-ezdwg-bootstrap-20260820

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ezdwg-bootstrap-20260820
      - name: Download LibreDWG bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/libredwg-artifact
          mkdir -p /tmp/libredwg-artifact bootstrap
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Long68-code/claude-dwg-assets/main/libredwg_ubuntu24.tar.gz -o /tmp/libredwg-artifact/libredwg_ubuntu24.tar.gz
          echo "$GITHUB_RUN_ID" > bootstrap/libredwg_run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/libredwg_run_id.txt
          git commit -m 'chore: record temporary libredwg artifact run'
          git push origin HEAD:chatgpt-ezdwg-bootstrap-20260820
      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-bundle
          path: /tmp/libredwg-artifact/libredwg_ubuntu24.tar.gz
          retention-days: 1
