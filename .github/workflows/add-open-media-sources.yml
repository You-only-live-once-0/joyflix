name: Add open media sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-open-media-sources.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Expand licensed media sources
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const additions = {
            ia_classic_tv: {
              api: 'adapter:internet-archive?collection=classic_tv',
              name: 'Internet Archive 经典电视'
            },
            ia_animation: {
              api: 'adapter:internet-archive?collection=animationandcartoons',
              name: 'Internet Archive 动画与卡通'
            },
            ia_silent_films: {
              api: 'adapter:internet-archive?collection=silent_films',
              name: 'Internet Archive 默片馆'
            },
            ia_open_movies: {
              api: 'adapter:internet-archive?collection=opensource_movies',
              name: 'Internet Archive 开放电影'
            },
            ia_movies_films: {
              api: 'adapter:internet-archive?collection=moviesandfilms',
              name: 'Internet Archive 电影与影像'
            }
          };
          config.api_site = { ...config.api_site, ...additions };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          JSON.parse(fs.readFileSync(path, 'utf8'));
          NODE

          rm -f .github/workflows/add-open-media-sources.yml

      - name: Commit source expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.json .github/workflows/add-open-media-sources.yml
          git commit -m 'feat: expand licensed public media sources'
          git push origin HEAD:main
